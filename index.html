<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fafafa" />

  <!-- Inter as the SF Pro fallback off Apple devices. Caveat is used only on the whiteboard. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400..700&display=swap"
    rel="stylesheet" />

  <title>Luis Castillo — Senior Software Engineer</title>
  <meta name="description"
    content="Software engineering, product, and forward-deployed AI. Eight years turning complexity into clean, tailored software, across Web2, Web3 and AI." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kasti.dev/" />
  <!-- Discord and others print this above the title; without it the card is anonymous. -->
  <meta property="og:site_name" content="kasti.dev" />
  <meta property="og:title" content="Luis Castillo — Senior Software Engineer" />
  <meta property="og:description"
    content="Software engineering, product, and forward-deployed AI. Eight years across Web2, Web3 and AI." />
  <!-- Scrapers need an absolute URL, and most will not follow a relative one. -->
  <meta property="og:image" content="https://kasti.dev/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Luis Castillo — software engineering, product, and forward-deployed AI." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://kasti.dev/og.png" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
